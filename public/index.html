<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Event Extractor - Gemini</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📅 AI Event Extractor</h1>
            <p class="subtitle">Powered by Google Gemini 2.5 Flash</p>
        </header>

        <!-- Input Section -->
        <div class="section">
            <h2>📝 Step 1: Paste Your Text</h2>
            <p class="info-text">Paste any text containing event information (news articles, emails, schedules, etc.)</p>
            <textarea 
                id="inputText" 
                placeholder="Paste your text here... Example: 'Join us for the Annual Tech Conference on October 25, 2025 at 2:00 PM at the Convention Center.'"
                rows="8"
            ></textarea>
            <div class="button-row">
                <button id="sampleBtn" class="btn btn-secondary">
                    Try Sample Data
                </button>
                <button id="extractBtn" class="btn btn-primary">
                    <span id="extractBtnText">🔍 Extract Events</span>
                    <span id="extractBtnLoader" class="loader" style="display: none;"></span>
                </button>
            </div>
        </div>

        <!-- Events Selection Section -->
        <div class="section" id="eventsSection" style="display: none;">
            <h2>✅ Step 2: Select Events</h2>
            <p class="info-text">Choose which events you want to add to your calendar</p>
            <div class="button-row">
                <button id="selectAllBtn" class="btn btn-secondary">Select All</button>
                <button id="deselectAllBtn" class="btn btn-secondary">Deselect All</button>
            </div>
            <div id="eventsList" class="events-list"></div>
            <button id="generateIcsBtn" class="btn btn-success">
                📥 Download Calendar (.ics)
            </button>
        </div>
    </div>

    <footer>
        <p>Built with Google Gemini AI • <a href="https://github.com/fossnik/URI-hackathon-1" target="_blank">GitHub</a></p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
